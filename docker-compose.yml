services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./config/api_keys.json:/run/secrets/api_keys.json:ro
      - ./config/mysql-ca.pem:/run/secrets/mysql-ca.pem:ro
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [api]
